name: Sync MCP for Blender

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout marketplace
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout upstream Codex integration
        uses: actions/checkout@v4
        with:
          repository: ahujasid/mcp-for-blender
          ref: main
          path: upstream
          sparse-checkout: |
            integrations/codex/.agents
            integrations/codex/plugins
          sparse-checkout-cone-mode: true

      - name: Sync plugin files
        run: |
          rm -rf plugins/mcp-for-blender
          mkdir -p plugins
          cp -R upstream/integrations/codex/plugins/mcp-for-blender plugins/mcp-for-blender
          rm -rf upstream

      - name: Validate marketplace identity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('.agents/plugins/marketplace.json')
          manifest = json.loads(manifest_path.read_text())

          if manifest.get('name') != 'cee-plugins':
              raise SystemExit('marketplace name must remain cee-plugins')
          if manifest.get('interface', {}).get('displayName') != 'Cee Plugins':
              raise SystemExit('marketplace display name must remain Cee Plugins')

          plugin_names = {plugin['name'] for plugin in manifest.get('plugins', [])}
          if 'mcp-for-blender' not in plugin_names:
              raise SystemExit('marketplace no longer contains mcp-for-blender')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agents plugins
          if git diff --cached --quiet; then
            echo 'No upstream changes.'
          else
            git commit -m 'chore: sync mcp-for-blender'
            git push
          fi
